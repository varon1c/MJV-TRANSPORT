<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <script src="js/main.js" defer></script>
    <title>MJV Van Transportation</title>
</head>
<body>
    <main class="home page-content">
        <header class="site-header">
        <button type="button" class="hamburger-menu" aria-label="Toggle navigation" aria-controls="navPills" aria-expanded="false">
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
        </button>
        
        <nav class="navigation-pill-list" id="navPills" aria-label="Main navigation">
            <div class="navigation-pill">
                <a href="inquire.html" class="title">INQUIRE</a>
            </div>
            <div class="navigation-pill">
                <a href="about-us.html" class="title">ABOUT US</a>
            </div>
            <div class="navigation-pill">
                <a href="contact-us.html" class="title">CONTACT US</a>
            </div>
            <div class="navigation-pill">
                <a href="apply-here.html" class="title">APPLY HERE</a>
            </div>
        </nav>
        <a href="index.html" class="icon-button">MJV TRANSPORT</a>
        </header>

        
        <h1 class="icon-button2">Contact us</h1>
        <div class="contact-section">
            <div class="contact-item">
                <img class="contact-icon" src="images/telepono.png" alt="Phone Icon">
                <div class="contact-info">
                    <a class="contact-number" href="tel:+639123456789">+63 912 345 6789</a>
                    <div class="contact-title">Contact</div>
                </div>
            </div>
            <div class="customer-service">
                <img class="customer-service-icon" src="images/telepono.png" alt="Customer Service Icon">
                <div class="customer-service-info">
                    <div class="customer-service-title">Customer Service</div>
                    <a class="customer-service-number" href="tel:+639123456789">+63 912 345 6789</a>
                </div>
            </div>
        </div>

        <div class="form-container">
            <form method="post" data-api-form="inquiry">
                <!-- First Name and Last Name Row -->
                <div class="name-inputs">
                    <div class="input-group">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="first_name" placeholder="Enter your first name" maxlength="100" autocomplete="given-name" required>
                    </div>
                    <div class="input-group">
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="last_name" placeholder="Enter your last name" maxlength="100" autocomplete="family-name" required>
                    </div>
                </div>
                
                <!-- Email Input -->
                <div class="input-group email-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" maxlength="254" autocomplete="email" required>
                </div>
                <div class="input-group">
                    <label for="phone">Phone (optional)</label>
                    <input type="tel" id="phone" name="phone" maxlength="40" autocomplete="tel">
                </div>
                <div class="input-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" maxlength="160" required>
                </div>
                
                <!-- Message Input -->
                <div class="input-group message-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Enter your message" rows="4" maxlength="5000" required></textarea>
                </div>
                <div class="input-group privacy-consent">
                    <input type="checkbox" id="inquiry-privacy-consent" name="privacy_consent" value="true" required>
                    <label for="inquiry-privacy-consent">I have read the <a href="privacy.html">Privacy Notice</a> and consent to the use of my information to respond to this inquiry.</label>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" class="submit-button">Send message</button>
                <p class="form-status" role="status" aria-live="polite" data-form-status></p>
            </form>
        </div>
        
    </main>

    <!-- Footer section -->
    <footer>
        <div class="footer-left">
            <div class="footer-info">
                <a href="https://www.facebook.com/jansen.manusig" target="_blank" rel="noopener noreferrer">
                <img class="download-3-icon" alt="facebook Icon" src="images/facebook.png">
                <div class="charles-jansen">Charles Jansen</div>
                </a>

                <a href="https://www.instagram.com/8klud/" target="_blank" rel="noopener noreferrer">
                <img class="download-3-icon" alt="Instagram Icon" src="images/instagram.png">
                <div class="klud">8klud</div>
                </a>

                <a href="mailto:Jansen.Manusig@gmail.com">
                <img class="download-3-icon" alt="gmail Icon" src="images/gmail.png">
                <div class="jansenmanusiggmailcom">Jansen.Manusig@gmail.com</div>
                </a>
            </div>
        </div>
        
        <div class="footer-center">
            <div class="charles-jansen-2024">© Charles Jansen 2024</div>
        </div>
    </footer>
</body>
</html>
